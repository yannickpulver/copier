<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#C9CDD4;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif}
.light{--bg:#F5F6F8;--sidebar:#EBEDF0;--surface:#FFFFFF;--line:#DADDE3;--text:#16181D;--text2:#565B66;--accent:#1D5FD1;--on-accent:#FFFFFF;--accent-soft:#E4EDFB;--ok:#1F7A3D;--ok-soft:#E3F3E8;--warn:#8A5A00;--warn-soft:#FBF0D5;--sel:#DCE0E7}
.dark{--bg:#1B1C1F;--sidebar:#232529;--surface:#292B30;--line:#393C43;--text:#F0F1F4;--text2:#A3A8B3;--accent:#6BA4FF;--on-accent:#0E1320;--accent-soft:#1B2A44;--ok:#5CC483;--ok-soft:#1D3326;--warn:#E5B454;--warn-soft:#3A2F17;--sel:#363940}
a{color:var(--accent)}a:hover{color:var(--accent)}
button{font:inherit}
@media (prefers-color-scheme: dark){body{background:#0F1012}}
</style>
</head>
<body>
<div class="light" id="window" style="width: 680px; height: 480px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; font-size: 13px;">

  <div style="flex: 0 0 38px; height: 38px; box-sizing: border-box; display: flex; align-items: center; padding: 0 14px; background: var(--sidebar);">
    <div style="flex: 0 0 100px; display: flex; align-items: center; gap: 8px;">
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #FF5F57;"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #FEBC2E;"></span>
      <span style="width: 12px; height: 12px; border-radius: 50%; background: #28C840;"></span>
    </div>
    <div style="flex: 1; display: flex; justify-content: center;">
      <h1 style="margin: 0; font-size: 13px; font-weight: 600;">Settings</h1>
    </div>
    <div style="flex: 0 0 100px;"></div>
  </div>

  <div style="flex: 0 0 60px; height: 60px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 4px; padding: 0 14px 6px; background: var(--sidebar); border-bottom: 1px solid var(--line);">

    <button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; width: 68px; height: 46px; border: 0; border-radius: 7px; background: var(--sel); color: var(--text);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a1 1 0 0 1 1-1h4.6l2 2H20a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7Z"/></svg>
      <span style="font-size: 11px; font-weight: 600;">Locations</span>
    </button>

    <button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; width: 68px; height: 46px; border: 0; border-radius: 7px; background: transparent; color: var(--text2);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="6.5" rx="1.5"/><rect x="3.5" y="13" width="17" height="6.5" rx="1.5"/><path d="M7 7.75h.01M7 16.25h.01"/></svg>
      <span style="font-size: 11px;">NAS</span>
    </button>

    <button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; width: 68px; height: 46px; border: 0; border-radius: 7px; background: transparent; color: var(--text2);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7V5.5h12V7"/><path d="M12 5.5v13"/><path d="M9.5 18.5h5"/></svg>
      <span style="font-size: 11px;">Naming</span>
    </button>

    <button type="button" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; width: 68px; height: 46px; border: 0; border-radius: 7px; background: transparent; color: var(--text2);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.5 13.7 9.2 18.5 11l-4.8 1.8L12 17.5l-1.7-4.7L5.5 11l4.8-1.8L12 4.5Z"/><path d="M18 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7.7-1.8Z"/></svg>
      <span style="font-size: 11px;">AI</span>
    </button>

  </div>

  <div style="flex: 1; min-height: 0; box-sizing: border-box; padding: 18px 24px 16px; display: flex; flex-direction: column; gap: 18px; overflow: hidden;">

    <div style="display: flex; flex-direction: column; gap: 7px;">
      <span style="font-size: 11px; font-weight: 600; color: var(--text2); letter-spacing: 0.3px; padding-left: 2px;">CHECK FOR EXISTING BACKUPS IN</span>
      <div style="box-sizing: border-box; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column;">
        <div style="display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 16px; color: var(--text2);"><rect x="3.5" y="4.5" width="17" height="6.5" rx="1.5"/><rect x="3.5" y="13" width="17" height="6.5" rx="1.5"/><path d="M7 7.75h.01M7 16.25h.01"/></svg>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 13px;">NAS /photo</span>
            <span style="font-size: 11px; color: var(--text2);">Synology</span>
          </span>
          <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2);">
            <span style="width: 7px; height: 7px; border-radius: 50%; background: var(--ok);"></span>
            <span>Connected</span>
          </span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 16px; color: var(--text2);"><rect x="3.5" y="6" width="17" height="12" rx="2"/><path d="M7.5 12h.01"/></svg>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 13px; font-family: 'SF Mono', ui-monospace, Menlo, monospace;">/Volumes/SSD T7</span>
            <span style="font-size: 11px; color: var(--text2);">External drive</span>
          </span>
          <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2);">
            <span style="width: 7px; height: 7px; border-radius: 50%; background: var(--line);"></span>
            <span>Not connected</span>
          </span>
        </div>
        <button type="button" style="display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 0; border-radius: 0 0 8px 8px; background: transparent; color: var(--accent); font-size: 13px; text-align: left;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 16px;"><path d="M12 6v12M6 12h12"/></svg>
          <span>Add location</span>
        </button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 7px;">
      <span style="font-size: 11px; font-weight: 600; color: var(--text2); letter-spacing: 0.3px; padding-left: 2px;">BACK UP TO</span>
      <div style="box-sizing: border-box; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column;">
        <div style="display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 16px; color: var(--text2);"><rect x="3.5" y="4.5" width="17" height="6.5" rx="1.5"/><rect x="3.5" y="13" width="17" height="6.5" rx="1.5"/><path d="M7 7.75h.01M7 16.25h.01"/></svg>
          <span style="flex: 1; min-width: 0; font-size: 13px;">NAS · /photo/2026</span>
          <span style="font-size: 11px; color: var(--accent); background: var(--accent-soft); padding: 3px 7px; border-radius: 4px;">Default</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line);">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 16px; color: var(--text2);"><rect x="3.5" y="6" width="17" height="12" rx="2"/><path d="M7.5 12h.01"/></svg>
          <span style="flex: 1; min-width: 0; font-size: 13px; font-family: 'SF Mono', ui-monospace, Menlo, monospace;">/Volumes/SSD T7/Photos</span>
        </div>
        <button type="button" style="display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 0; border-radius: 0 0 8px 8px; background: transparent; color: var(--accent); font-size: 13px; text-align: left;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: 0 0 16px;"><path d="M12 6v12M6 12h12"/></svg>
          <span>Add destination</span>
        </button>
      </div>
    </div>

    <div style="flex: 1;"></div>

    <span style="font-size: 12px; color: var(--text2);">Folder names use YYYY.MM.DD - Topic. Change in Naming.</span>

  </div>

</div>
<script>
// follow the system appearance; add ?dark or ?light to force one
var q=location.search,w=document.getElementById("window");
if(q==="?dark"||(q!=="?light"&&matchMedia("(prefers-color-scheme: dark)").matches))w.className="dark";
</script>
</body>
</html>
