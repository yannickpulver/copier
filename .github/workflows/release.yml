name: Build and Release

on:
  push:
    branches: [main]
  # Pull requests run everything up to the signed, notarized zip as a dress
  # rehearsal; only a push to main creates the release and updates the tap.
  pull_request:
    branches: [main]

jobs:
  check-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from VERSION file
        id: version
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Check whether this version was already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release v${{ steps.version.outputs.version }} already exists, skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build-macos:
    runs-on: macos-26
    needs: check-tag
    if: needs.check-tag.outputs.exists != 'true' || github.event_name == 'pull_request'
    env:
      VERSION: ${{ needs.check-tag.outputs.version }}
      # Secrets can't be used directly in `if:` conditions, so mirror the ones
      # that gate signing/notarization into env vars once, here.
      HAS_APPLE_SECRETS: ${{ secrets.APPLE_ID != '' && secrets.APPLE_CERTIFICATE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # The macOS 26 SDK is required to build Copier, so pick the newest
          # Xcode available on the runner image instead of hardcoding a
          # version — GitHub updates the bundled Xcode versions over time,
          # and pinning would silently go stale.
          LATEST_XCODE=$(ls /Applications | grep '^Xcode.*\.app$' | sort -V | tail -n1)
          echo "Using $LATEST_XCODE"
          sudo xcode-select -s "/Applications/$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install Tuist
        run: brew install --formula tuist

      - name: Run CopierCore tests
        working-directory: macos/CopierCore
        run: swift test

      - name: Generate Xcode project
        working-directory: macos
        run: tuist generate --no-open

      - name: Import signing certificate
        if: env.HAS_APPLE_SECRETS == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          rm certificate.p12

      - name: Archive
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # When Apple secrets aren't configured (e.g. a fork), fall back to
          # ad-hoc signing so the archive step still succeeds; notarization,
          # stapling and verification below are skipped in that case.
          if [ "$HAS_APPLE_SECRETS" = "true" ]; then
            CODE_SIGN_IDENTITY="Developer ID Application"
            CODE_SIGN_STYLE="Manual"
            EXTRA_SIGN_FLAGS=(OTHER_CODE_SIGN_FLAGS=--timestamp DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM")
          else
            CODE_SIGN_IDENTITY="-"
            CODE_SIGN_STYLE="Automatic"
            EXTRA_SIGN_FLAGS=()
          fi

          xcodebuild archive \
            -workspace macos/Copier.xcworkspace \
            -scheme Copier \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/Copier.xcarchive" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE="$CODE_SIGN_STYLE" \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            "${EXTRA_SIGN_FLAGS[@]}"

      - name: Export archive
        if: env.HAS_APPLE_SECRETS == 'true'
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # exportArchive (rather than copying the .app straight out of the
          # archive's Products dir) re-validates entitlements/provisioning
          # against the requested distribution method, which is what makes
          # the resulting .app notarizable. It only works with a Developer ID
          # identity, so the ad-hoc path below skips it entirely.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>teamID</key>
            <string>${DEVELOPMENT_TEAM}</string>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Copier.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Copy ad-hoc signed app out of the archive
        if: env.HAS_APPLE_SECRETS != 'true'
        run: |
          # No Developer ID identity: exportArchive would fail on the
          # developer-id method, so take the app straight from the archive.
          mkdir -p "$RUNNER_TEMP/export"
          ditto \
            "$RUNNER_TEMP/Copier.xcarchive/Products/Applications/Copier.app" \
            "$RUNNER_TEMP/export/Copier.app"

      - name: Zip app
        run: |
          ditto -c -k --keepParent "$RUNNER_TEMP/export/Copier.app" "Copier-${VERSION}.zip"

      - name: Notarize
        if: env.HAS_APPLE_SECRETS == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "Copier-${VERSION}.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Staple and re-zip
        if: env.HAS_APPLE_SECRETS == 'true'
        run: |
          xcrun stapler staple "$RUNNER_TEMP/export/Copier.app"
          rm "Copier-${VERSION}.zip"
          ditto -c -k --keepParent "$RUNNER_TEMP/export/Copier.app" "Copier-${VERSION}.zip"

      - name: Verify signature and notarization
        if: env.HAS_APPLE_SECRETS == 'true'
        run: |
          spctl -a -vv "$RUNNER_TEMP/export/Copier.app"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/export/Copier.app"

      - uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: Copier-*.zip

  release:
    runs-on: ubuntu-latest
    needs: [check-tag, build-macos]
    if: github.event_name == 'push' && needs.check-tag.outputs.exists != 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-macos
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-tag.outputs.version }}
          name: Copier ${{ needs.check-tag.outputs.version }}
          files: artifacts/**/*
          generate_release_notes: true

  update-homebrew:
    needs: [check-tag, release]
    if: github.event_name == 'push' && needs.check-tag.outputs.exists != 'true'
    uses: ./.github/workflows/update-homebrew-tap.yml
    with:
      tag: v${{ needs.check-tag.outputs.version }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
